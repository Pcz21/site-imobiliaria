# /etc/nginx/sites-available/fabijuimoveis  (symlink em sites-enabled)
# Reverse proxy: Cloudflare -> Nginx (443) -> Next (127.0.0.1:3000) -> API (5162)

# IP real do visitante atrás do proxy laranja do Cloudflare.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name fabijuimoveis.com.br www.fabijuimoveis.com.br;

    # Desafio HTTP-01 do Certbot (caso use Let's Encrypt)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fabijuimoveis.com.br www.fabijuimoveis.com.br;

    # === Certificado SSL ===
    # Opção A (RECOMENDADA com Cloudflare): Origin Certificate do Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/fabiju-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/fabiju-origin.key;
    # Opção B (Let's Encrypt/Certbot): comente as 2 linhas acima e descomente:
    # ssl_certificate     /etc/letsencrypt/live/fabijuimoveis.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fabijuimoveis.com.br/privkey.pem;

    client_max_body_size 60M;   # uploads de vídeo (limite da app: 50 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
